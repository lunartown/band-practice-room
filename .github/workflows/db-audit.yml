name: DB audit

# 공유 Postgres 의 데이터 정합성 점검(db-audit)을 읽기 전용(SELECT only)으로 실행한다.
# 클라우드 세션·루틴이 workflow_dispatch 로 트리거하고, 실행 로그로 결과(JSON)를 회수한다.
# 서비스(Render API)와 격리된 CI 러너에서 돌아 사용자 트래픽에 영향을 주지 않는다.
#
# 사전 준비(이미 등록됨 — scrape.yml / enrich.yml 과 동일 시크릿 재사용):
#   DATABASE_URL     = Render Postgres prod 외부 연결 문자열
#   DATABASE_URL_DEV = Render Postgres dev 외부 연결 문자열(수동 실행에서 dev 대상 선택 시 사용)

on:
  workflow_dispatch:
    inputs:
      database:
        description: '대상 DB'
        type: choice
        options:
          - prod
          - dev
        default: prod

concurrency:
  group: db-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_TARGET: ${{ inputs.database || 'prod' }}
      PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 선택한 대상을 명시적으로 해석하고, 해당 시크릿이 비어 있으면 실패한다.
      # `a && b || c` 표현식은 dev 시크릿이 없을 때 조용히 prod 로 폴백해
      # dev 점검이 prod 를 조회하는 사고가 나므로 쓰지 않는다(scrape.yml 과 동일 패턴).
      - name: Resolve database target
        run: |
          set -euo pipefail
          TARGET="${DATABASE_TARGET:-prod}"
          case "$TARGET" in
            prod) RESOLVED_DATABASE_URL="$PROD_DATABASE_URL" ;;
            dev)  RESOLVED_DATABASE_URL="$DATABASE_URL_DEV" ;;
            *)
              echo "::error::database는 prod/dev 중 하나여야 합니다: $TARGET"
              exit 1
              ;;
          esac
          if [ -z "$RESOLVED_DATABASE_URL" ]; then
            echo "::error::${TARGET} DATABASE_URL 시크릿이 없습니다."
            exit 1
          fi
          echo "::add-mask::$RESOLVED_DATABASE_URL"
          echo "DATABASE_URL=$RESOLVED_DATABASE_URL" >> "$GITHUB_ENV"
          echo "DB target: $TARGET"

      - name: Run db-audit (read-only)
        working-directory: src/scraper
        run: |
          npm ci
          npm run audit:db
